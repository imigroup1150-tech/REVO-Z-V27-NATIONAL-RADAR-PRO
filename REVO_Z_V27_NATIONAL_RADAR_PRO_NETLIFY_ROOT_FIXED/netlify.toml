[build]
  publish = "."
  command = "node scripts/build-national.mjs"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/data/radar-national/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, immutable"
